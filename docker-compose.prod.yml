# Production docker-compose override file.
# Only nginx is published. Databases, brokers, telemetry, and application
# services stay on the private Compose network and must be exposed through a
# controlled ingress/private operator path.
services:
  mongo1:
    image: mongo:7
    command: mongod --replSet rs0 --bind_ip_all --port 27017
    restart: unless-stopped
    volumes:
      - mongo1_data:/data/db
      - ./docker/mongo/init-replica.sh:/docker-entrypoint-initdb.d/init-replica.sh:ro
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping').ok", '--quiet']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  mongo2:
    image: mongo:7
    command: mongod --replSet rs0 --bind_ip_all --port 27017
    restart: unless-stopped
    volumes:
      - mongo2_data:/data/db
    depends_on:
      - mongo1
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping').ok", '--quiet']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  mongo3:
    image: mongo:7
    command: mongod --replSet rs0 --bind_ip_all --port 27017
    restart: unless-stopped
    volumes:
      - mongo3_data:/data/db
    depends_on:
      - mongo1
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping').ok", '--quiet']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  redis-cache:
    image: redis:7-alpine
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --save ""
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G

  redis-queue:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy noeviction --appendonly yes
    restart: unless-stopped
    volumes:
      - redis_queue_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  kafka:
    image: redpandadata/redpanda:v24.3.2
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --check=false
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr=PLAINTEXT://kafka:9092,OUTSIDE://localhost:19092
      - --pandaproxy-addr=0.0.0.0:8082
      - --advertise-pandaproxy-addr=kafka:8082
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'rpk cluster health | grep -q Healthy']
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    volumes:
      - ./docker/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    depends_on:
      - backend
      - routing-search
      - realtime-gateway
      - search-indexer
      - matching-orchestrator
      - notification-consumer
      - analytics-pipeline
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  grafana:
    image: grafana/grafana:11.2.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme-in-production}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./docker/monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./docker/monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./docker/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  realtime-gateway:
    build:
      context: ./services/realtime-gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 5002
      FRONTEND_URL: http://localhost,http://localhost:3001,http://localhost:3002
      REDIS_CACHE_URL: redis://redis-cache:6379
      REDIS_URL: redis://redis-cache:6379
      REALTIME_EVENT_CHANNEL: ${REALTIME_EVENT_CHANNEL:-hopdrop:realtime:events}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      LOG_LEVEL: warn
    depends_on:
      redis-cache:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  search-indexer:
    build:
      context: ./services/search-indexer
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      SEARCH_INDEXER_PORT: ${SEARCH_INDEXER_PORT:-5003}
      SEARCH_INDEXER_LOG_LEVEL: warn
      ROUTING_SEARCH_URL: http://routing-search:8010
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: hopdrop-search-indexer
      KAFKA_TOPIC_PREFIX: ${KAFKA_TOPIC_PREFIX:-hopdrop}
    depends_on:
      kafka:
        condition: service_healthy
      routing-search:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  matching-orchestrator:
    build:
      context: ./services/matching-orchestrator
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      MATCHING_ORCHESTRATOR_PORT: ${MATCHING_ORCHESTRATOR_PORT:-5004}
      MATCHING_ORCHESTRATOR_LOG_LEVEL: warn
      CORE_API_URL: http://backend:5000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN must be set for production}
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: hopdrop-matching-orchestrator
      KAFKA_TOPIC_PREFIX: ${KAFKA_TOPIC_PREFIX:-hopdrop}
    depends_on:
      kafka:
        condition: service_healthy
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  notification-consumer:
    build:
      context: ./services/notification-consumer
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      NOTIFICATION_CONSUMER_PORT: ${NOTIFICATION_CONSUMER_PORT:-5005}
      NOTIFICATION_CONSUMER_LOG_LEVEL: warn
      MONGODB_URI: mongodb://mongo1:27017,mongo2:27017,mongo3:27017/hopdrop?replicaSet=rs0
      REDIS_CACHE_URL: redis://redis-cache:6379
      REDIS_URL: redis://redis-cache:6379
      REALTIME_EVENT_CHANNEL: ${REALTIME_EVENT_CHANNEL:-hopdrop:realtime:events}
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: hopdrop-notification-consumer
      KAFKA_TOPIC_PREFIX: ${KAFKA_TOPIC_PREFIX:-hopdrop}
    depends_on:
      mongo1:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  analytics-pipeline:
    build:
      context: ./services/analytics-pipeline
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      ANALYTICS_PIPELINE_PORT: ${ANALYTICS_PIPELINE_PORT:-5006}
      ANALYTICS_PIPELINE_LOG_LEVEL: warn
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: hopdrop-analytics-pipeline
      KAFKA_TOPIC_PREFIX: ${KAFKA_TOPIC_PREFIX:-hopdrop}
    depends_on:
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-hopdrop-local-internal-token}
      MONGODB_URI: mongodb://mongo1:27017,mongo2:27017,mongo3:27017/hopdrop?replicaSet=rs0
      REDIS_CACHE_URL: redis://redis-cache:6379
      REDIS_QUEUE_URL: redis://redis-queue:6379
      REALTIME_EVENT_CHANNEL: ${REALTIME_EVENT_CHANNEL:-hopdrop:realtime:events}
      ROUTING_SEARCH_URL: http://routing-search:8010
      LOG_LEVEL: warn
      REQUIRE_HTTPS: 'false'
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: hopdrop-core-api
      KAFKA_TOPIC_PREFIX: hopdrop
      OUTBOX_RELAY_ENABLED: 'true'
      BULL_BOARD_PASSWORD: ${BULL_BOARD_PASSWORD:?BULL_BOARD_PASSWORD must be set for production}
      DEMO_MODE: 'false'
      NODE_ENV: production
    depends_on:
      mongo1:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
      kafka:
        condition: service_healthy
    command: npm run start
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:5000/ready']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  routing-search:
    build:
      context: ./services/routing-search
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      ROUTING_SEARCH_ENV: production
      ROUTING_SEARCH_HOST: 0.0.0.0
      ROUTING_SEARCH_PORT: 8010
      ROUTING_SEARCH_REDIS_URL: redis://redis-cache:6379/0
      ROUTING_SEARCH_MAPMYINDIA_CLIENT_ID: ${MMI_CLIENT_ID}
      ROUTING_SEARCH_MAPMYINDIA_CLIENT_SECRET: ${MMI_CLIENT_SECRET}
      ROUTING_SEARCH_MAPMYINDIA_REST_API_KEY: ${MMI_REST_API_KEY}
      ROUTING_SEARCH_LOG_LEVEL: WARNING
      ROUTING_SEARCH_SENTRY_DSN: ${ROUTING_SEARCH_SENTRY_DSN:-}
      ROUTING_SEARCH_SENTRY_TRACES_SAMPLE_RATE: ${ROUTING_SEARCH_SENTRY_TRACES_SAMPLE_RATE:-0.1}
    depends_on:
      redis-cache:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/ready', timeout=5).read()"]
      interval: 10s
      timeout: 8s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  sender-portal:
    build:
      context: .
      dockerfile: ./sender-portal/Dockerfile
      args:
        VITE_API_URL: http://localhost
        VITE_SOCKET_URL: http://localhost
        VITE_MMI_KEY: ${MMI_CLIENT_ID}
        VITE_RAZORPAY_KEY_ID: ${VITE_RAZORPAY_KEY_ID}
        VITE_POSTHOG_KEY: ${VITE_POSTHOG_KEY:-}
        VITE_POSTHOG_HOST: ${VITE_POSTHOG_HOST:-}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_APP_ENV: production
        VITE_RELEASE: production
        VITE_ANALYTICS_DEBUG: false
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  carrier-portal:
    build:
      context: .
      dockerfile: ./carrier-portal/Dockerfile
      args:
        VITE_API_URL: http://localhost
        VITE_SOCKET_URL: http://localhost
        VITE_MMI_KEY: ${MMI_CLIENT_ID}
        VITE_RAZORPAY_KEY_ID: ${VITE_RAZORPAY_KEY_ID}
        VITE_POSTHOG_KEY: ${VITE_POSTHOG_KEY:-}
        VITE_POSTHOG_HOST: ${VITE_POSTHOG_HOST:-}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_APP_ENV: production
        VITE_RELEASE: production
        VITE_ANALYTICS_DEBUG: false
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      sender-portal:
        condition: service_healthy
      carrier-portal:
        condition: service_healthy
      backend:
        condition: service_healthy
      realtime-gateway:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/ready']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

volumes:
  mongo1_data:
  mongo2_data:
  mongo3_data:
  redis_queue_data:
