server {
  listen 80;
  resolver 127.0.0.11 ipv6=off valid=30s;

  location / {
    set $sender_upstream http://sender-portal:3001;
    proxy_pass $sender_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location = /carrier {
    return 302 /carrier/;
  }

  location /carrier/ {
    set $carrier_upstream http://carrier-portal:3002;
    proxy_pass $carrier_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /api {
    set $backend_upstream http://backend:5000;
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /socket.io {
    set $socket_upstream http://realtime-gateway:5002;
    proxy_pass $socket_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }
}
