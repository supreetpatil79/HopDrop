[project]
name = "hopdrop-routing-search"
version = "0.1.0"
description = "Routing and search microservice for HopDrop"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "httpx>=0.27.0",
  "prometheus-client>=0.21.0",
  "redis>=5.0.8",
  "sentry-sdk[fastapi]>=2.18.0",
  "structlog>=24.4.0",
  "h3>=4.1.2"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0"
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
