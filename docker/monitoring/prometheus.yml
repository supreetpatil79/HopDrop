global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: core-api
    metrics_path: /metrics
    static_configs:
      - targets: ['backend:5000']

  - job_name: routing-search
    metrics_path: /metrics
    static_configs:
      - targets: ['routing-search:8010']

  - job_name: realtime-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ['realtime-gateway:5002']

  - job_name: search-indexer
    metrics_path: /metrics
    static_configs:
      - targets: ['search-indexer:5003']

  - job_name: matching-orchestrator
    metrics_path: /metrics
    static_configs:
      - targets: ['matching-orchestrator:5004']

  - job_name: notification-consumer
    metrics_path: /metrics
    static_configs:
      - targets: ['notification-consumer:5005']

  - job_name: analytics-pipeline
    metrics_path: /metrics
    static_configs:
      - targets: ['analytics-pipeline:5006']
