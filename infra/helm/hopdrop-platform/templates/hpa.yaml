{{- if .Values.autoscaling.enabled }}
{{- range $name := list "backend" "routingSearch" "realtimeGateway" "sender" "carrier" }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "hopdrop.fullname" $ }}-{{ $name | kebabcase }}
  labels:
    {{- include "hopdrop.labels" $ | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "hopdrop.fullname" $ }}-{{ $name | kebabcase }}
  minReplicas: {{ $.Values.autoscaling.minReplicas }}
  maxReplicas: {{ $.Values.autoscaling.maxReplicas }}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ $.Values.autoscaling.targetCPUUtilizationPercentage }} }
    - type: Resource
      resource:
        name: memory
        target: { type: Utilization, averageUtilization: {{ $.Values.autoscaling.targetMemoryUtilizationPercentage }} }
---
{{- end }}
{{- end }}
