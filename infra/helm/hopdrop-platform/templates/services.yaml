{{- range $name, $service := .Values.services }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hopdrop.fullname" $ }}-{{ $name | kebabcase }}
  labels:
    {{- include "hopdrop.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name | kebabcase }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: {{ $name | kebabcase }}
  ports:
    - name: http
      port: {{ $service.port }}
      targetPort: http
      protocol: TCP
---
{{- end }}
