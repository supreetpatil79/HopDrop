name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: hopdrop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency review
        uses: actions/dependency-review-action@v4

  repo-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify generated artifacts are not tracked
        run: npm run verify:repo

  node-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build workspaces
        run: npm run build

      - name: Run Node and portal tests
        run: npm test

      - name: Audit backend dependencies
        run: npm run audit:backend

      - name: Audit portal dependencies
        run: npm run audit:portals

  routing-search:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/routing-search
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install routing-search dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run routing-search tests
        run: pytest -q

      - name: Lint routing-search with ruff
        run: |
          pip install ruff
          ruff check app/

  helm-chart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Lint production chart
        run: helm lint infra/helm/hopdrop-platform -f infra/helm/hopdrop-platform/values-prod.yaml

      - name: Render staging chart
        run: helm template hopdrop infra/helm/hopdrop-platform -f infra/helm/hopdrop-platform/values-staging.yaml >/tmp/hopdrop-staging.yaml

      - name: Render production chart
        run: helm template hopdrop infra/helm/hopdrop-platform -f infra/helm/hopdrop-platform/values-prod.yaml >/tmp/hopdrop-production.yaml

  container-security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - node-quality
      - routing-search
      - helm-chart
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: .
            dockerfile: backend/Dockerfile
          - name: sender-portal
            context: .
            dockerfile: sender-portal/Dockerfile
          - name: carrier-portal
            context: .
            dockerfile: carrier-portal/Dockerfile
          - name: routing-search
            context: services/routing-search
            dockerfile: Dockerfile
          - name: realtime-gateway
            context: services/realtime-gateway
            dockerfile: Dockerfile
          - name: search-indexer
            context: services/search-indexer
            dockerfile: Dockerfile
          - name: matching-orchestrator
            context: services/matching-orchestrator
            dockerfile: Dockerfile
          - name: notification-consumer
            context: services/notification-consumer
            dockerfile: Dockerfile
          - name: analytics-pipeline
            context: services/analytics-pipeline
            dockerfile: Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image for security scan
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          tags: hopdrop/${{ matrix.name }}:${{ github.sha }}
          load: true

      - name: Scan image and fail on high/critical findings
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: hopdrop/${{ matrix.name }}:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Generate image SBOM
        uses: anchore/sbom-action@v0
        with:
          image: hopdrop/${{ matrix.name }}:${{ github.sha }}
          artifact-name: sbom-${{ matrix.name }}.spdx.json
          output-file: sbom-${{ matrix.name }}.spdx.json

  platform-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - repo-hygiene
      - node-quality
      - routing-search
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare local env
        run: cp .env.example .env

      - name: Start stack
        run: docker compose up -d --build --wait

      - name: Run platform smoke check
        run: npm run verify:platform

      - name: Show running services
        if: always()
        run: docker compose ps

      - name: Tear down stack
        if: always()
        run: docker compose down -v --remove-orphans

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - platform-smoke
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare local env
        run: cp .env.example .env

      - name: Start stack
        run: docker compose up -d --build --wait

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Tear down stack
        if: always()
        run: docker compose down -v --remove-orphans
